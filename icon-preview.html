<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小程序头像预览</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            gap: 40px;
        }

        h1 {
            color: white;
            font-size: 32px;
            text-align: center;
            text-shadow: 0 2px 10px rgba(0,0,0,0.2);
        }

        .icon-container {
            display: flex;
            gap: 60px;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
        }

        .icon-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }

        .icon-label {
            color: white;
            font-size: 18px;
            font-weight: 500;
        }

        img {
            border-radius: 24px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            transition: transform 0.3s;
        }

        img:hover {
            transform: scale(1.05);
        }

        .download-btn {
            padding: 12px 32px;
            background: white;
            color: #764ba2;
            border: none;
            border-radius: 24px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            transition: all 0.3s;
        }

        .download-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
        }

        .tips {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            padding: 20px 30px;
            border-radius: 16px;
            color: white;
            max-width: 600px;
            line-height: 1.8;
        }

        .tips h3 {
            margin-bottom: 12px;
            font-size: 20px;
        }
    </style>
</head>
<body>
    <h1>🎨 儿童问答小程序头像</h1>

    <div class="icon-container">
        <div class="icon-item">
            <img src="app-icon.svg" alt="小程序图标" width="256" height="256">
            <span class="icon-label">512 × 512</span>
        </div>
    </div>

    <button class="download-btn" onclick="downloadIcon()">📥 下载图标</button>

    <div class="tips">
        <h3>💡 使用说明</h3>
        <p>• 适用于微信小程序、App 图标等场景</p>
        <p>• SVG 格式，可无损缩放</p>
        <p>• 白色背景，粉色蓝色渐变元素</p>
        <p>✨ 星星 + 对话气泡，象征好奇心与发现</p>
    </div>

    <script>
        function downloadIcon() {
            const link = document.createElement('a');
            link.href = 'app-icon.svg';
            link.download = '儿童问答小程序图标.svg';
            link.click();
        }
    </script>
</body>
</html>
